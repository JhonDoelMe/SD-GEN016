services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sd_user}:${POSTGRES_PASSWORD:-sd_password}@db:5432/${POSTGRES_DB:-sd_gen016}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    networks:
      - sd_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sd_password}
      POSTGRES_DB: ${POSTGRES_DB:-sd_gen016}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sd_user} -d ${POSTGRES_DB:-sd_gen016}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sd_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-generator-016.pp.ua}
    volumes:
      - ./docker/nginx.conf:/tmp/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./docker/ssl-fallback:/etc/nginx/ssl-fallback:ro
      - uploads_data:/app/uploads:ro
    command:
      - /bin/sh
      - -c
      - |
        DOMAIN="$${PRIMARY_DOMAIN:-generator-016.pp.ua}"
        sed "s/__PRIMARY_DOMAIN__/$$DOMAIN/g" /tmp/nginx.conf > /etc/nginx/conf.d/default.conf
        mkdir -p /tmp/ssl
        if [ -f /etc/nginx/ssl/fullchain.pem ] && [ -f /etc/nginx/ssl/privkey.pem ]; then
          cp /etc/nginx/ssl/fullchain.pem /tmp/ssl/fullchain.pem
          cp /etc/nginx/ssl/privkey.pem /tmp/ssl/privkey.pem
          echo "[SSL] Loaded custom SSL certificates from /etc/nginx/ssl"
        elif [ -f /etc/nginx/ssl-fallback/fullchain.pem ] && [ -f /etc/nginx/ssl-fallback/privkey.pem ]; then
          cp /etc/nginx/ssl-fallback/fullchain.pem /tmp/ssl/fullchain.pem
          cp /etc/nginx/ssl-fallback/privkey.pem /tmp/ssl/privkey.pem
          echo "[SSL] Loaded fallback SSL certificates from /etc/nginx/ssl-fallback"
        else
          if ! command -v openssl >/dev/null 2>&1; then
            apk add --no-cache openssl >/dev/null 2>&1 || true
          fi
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /tmp/ssl/privkey.pem \
            -out /tmp/ssl/fullchain.pem \
            -subj "/CN=$$DOMAIN" >/dev/null 2>&1
          echo "[SSL] Generated ephemeral self-signed fallback certificate for $$DOMAIN"
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sd_network

volumes:
  postgres_data:
  uploads_data:
  backups_data:

networks:
  sd_network:
    driver: bridge

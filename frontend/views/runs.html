    <section id="tab-runs" class="tab-pane" style="display: none;">
      <div class="panel">
        <div class="panel-header" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem;">
          <h3 style="margin: 0;">Експлуатаційний журнал запусків і зупинок</h3>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem;">
            <label style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; margin: 0;">
              <input type="checkbox" id="runsShowTestToggle" onchange="if (typeof loadRunsData === 'function') loadRunsData()" style="accent-color: #f59e0b;">
              <span>🧪 Показати тестові</span>
            </label>
            <button type="button" id="btnCleanupShortRuns" class="btn-secondary" style="display: none; padding: 0.35rem 0.7rem; font-size: 0.82rem; width: auto;" onclick="if (typeof cleanupShortRunsPrompt === 'function') cleanupShortRunsPrompt()">
              🧹 Очистити короткі
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="allRunsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Час запуску</th>
                <th>Час зупинки</th>
                <th>Початкові год</th>
                <th>Кінцеві год</th>
                <th>Тривалість</th>
                <th>Розрахункова витрата</th>
                <th>Бак (поч/кін)</th>
                <th>Оператор</th>
                <th>Примітки</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

upstream app_server {
    server app:8000;
}

upstream ota_server {
    server host.docker.internal:8090;
}

# 1. Default server block: Drop any request to unauthorized hostnames, clone domains or direct IP access
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /tmp/ssl/fullchain.pem;
    ssl_certificate_key /tmp/ssl/privkey.pem;

    # Nginx special code 444: close connection immediately with zero bytes returned
    return 444;
}

# 2. HTTP to HTTPS mandatory redirect block (INF-04, ACME challenge, Cloudflare & Reverse Proxy SSL support)
server {
    listen 80;
    listen [::]:80;
    server_name __PRIMARY_DOMAIN__;

    # ACME challenge for Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Pass through to app if request is already HTTPS terminated upstream (Cloudflare / reverse proxy)
    # Otherwise redirect plain HTTP to HTTPS (INF-04)
    location ^~ /ota/ {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://ota_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }

        proxy_pass http://app_server;
    }
}

# 3. Main legitimate HTTPS server block (INF-05: strictly primary domain, no localhost/IP)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PRIMARY_DOMAIN__;

    ssl_certificate /tmp/ssl/fullchain.pem;
    ssl_certificate_key /tmp/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Global Security Headers (INF-06, INF-11: safe HSTS without rogue subdomains)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Crawlers robots.txt
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\n";
    }

    # Service Worker & Manifest: Never cache sw.js (INF-06: retain security headers)
    location = /sw.js {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.json {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Static versioned frontend assets (cached in browser, busted via ?v=X.Y.Z)
    location /frontend/ {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Uploads access proxied to backend for authentication & validation (INF-07)
    location /uploads/ {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Standalone OTA APK Distribution & Update Service
    location = /ota {
        return 301 https://$host/ota/;
    }

    location ^~ /ota/ {
        proxy_pass http://ota_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Proxy everything else to FastAPI application
    location / {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
